    workshop: articles/ethics-on-ai/ai-ethics-empirical-study/workshop.html
  briefing: Um estudo empírico com 99 profissionais de IA e legisladores de 20 países revela que transparência,
    accountability e privacidade são os princípios éticos mais críticos, mas a falta de conhecimento ético,
    ausência de frameworks legais e conflito na prática permanecem como barreiras severas para a adoção
    de IA eticamente alinhada.
