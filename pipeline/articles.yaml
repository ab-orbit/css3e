    blog: articles/sistemas-multiagente-contexto/context-aware-mas/blog.html
    workshop: articles/sistemas-multiagente-contexto/context-aware-mas/workshop.html
  briefing: Este survey apresenta uma arquitetura unificada para Sistemas Multi-Agente Conscientes de
    Contexto (CA-MAS), integrando as cinco capacidades essenciais dos agentes — Sense, Learn, Reason,
    Predict e Act — em um framework coerente. A pesquisa preenche uma lacuna crítica ao conectar consciência
    de contexto e sistemas multi-agente, oferecendo taxonomia organizada, processo geral de desenvolvimento
    e análise de aplicações em oito domínios distintos.
