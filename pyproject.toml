[project]
name = "css3e-pipeline"
version = "0.1.0"
description = "Article-to-site generator: PDF paper -> guided reading page, blog post, audio player, Google Slides preview, remote workshop page, and site-wide SEO/GEO/AEO wiring."
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "notebooklm-py>=0.1",
    "pypdf>=4.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Needed only for the interactive `notebooklm login` bootstrap, which drives a
# real browser. Unattended runs use NOTEBOOKLM_AUTH_JSON and never load this.
browser = ["playwright>=1.40"]
# GLiNER entity extraction. Kept optional: it pulls torch (~2GB) and downloads
# model weights, which nobody rendering templates needs.
entities = ["gliner>=0.2.28", "torch>=2.0", "loguru>=0.7"]
# Local authoring console (`pipeline serve`). Optional: publishing the static
# site never needs a server.
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]
