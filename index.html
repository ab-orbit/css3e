<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O sistema que reage a você</title>
  <style>
    :root {
      --red: #E8172D;
      --dark: #231F20;
      --light: #F2F2F2;
      --pink: #F16978;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--dark);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    /* Papel milimetrado: mesmo fundo da tela de abertura, para as duas telas
       lerem como partes do mesmo instrumento. */
    body {
      background-image:
        linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
      background-size: 34px 34px, 34px 34px;
      background-attachment: fixed;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--white);
      color: var(--dark);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--red), var(--pink));
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 22px;
      line-height: 1.3;
      margin: 0 0 14px 0;
      font-weight: 800;
    }

    p.lead {
      font-size: 14.5px;
      line-height: 1.55;
      color: #4a4a4a;
      margin: 0 0 22px 0;
    }

    .sysmsg {
      background: var(--light);
      border-left: 3px solid var(--red);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #333;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .sysmsg b {
      color: var(--red);
    }

    button {
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      padding: 14px 22px;
      cursor: pointer;
      width: 100%;
      transition: transform .12s ease, opacity .12s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--red);
      color: white;
    }

    .btn-primary:hover {
      opacity: .92;
    }

    .btn-secondary {
      background: var(--light);
      color: var(--dark);
      margin-top: 10px;
    }

    .slider-wrap {
      margin: 26px 0 8px 0;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--red);
      height: 6px;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: #666;
      margin-top: 6px;
      line-height: 1.4;
    }

    .slider-labels span {
      max-width: 44%;
    }

    .slider-labels span:last-child {
      text-align: right;
    }

    .choice-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 18px 0 6px 0;
    }

    .choice {
      border: 2px solid var(--light);
      background: var(--light);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      line-height: 1.45;
      transition: border-color .15s, background .15s;
    }

    .choice b {
      display: block;
      font-size: 14.5px;
      margin-bottom: 3px;
    }

    .choice:hover {
      border-color: var(--pink);
    }

    .choice.selected {
      border-color: var(--red);
      background: #fff0f1;
    }

    .progress {
      display: flex;
      gap: 5px;
      margin-bottom: 18px;
    }

    .progress i {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--light);
    }

    .progress i.done {
      background: var(--red);
    }

    .fieldrow {
      margin-bottom: 16px;
    }

    .fieldrow label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #666;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .fieldrow input[type=text] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1.5px solid #ddd;
      font-size: 14px;
      font-family: inherit;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }

    /* Map screen */
    .mapcard {
      max-width: 640px;
    }

    #svgwrap {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 6px 0 14px 0;
    }

    /* A placa do mapa é sempre clara, inclusive no cartão escuro: o diagrama
       das três categorias tem traço fino e some quando fica esmaecido no escuro. */
    #svgwrap svg {
      border-radius: 14px;
      box-shadow: 0 10px 34px rgba(0, 0, 0, .28);
    }

    /* Na projeção o cartão é bem mais largo: o triângulo acompanha. */
    .fac-map #svgwrap svg { max-width: 720px; }

    .legend {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: var(--light);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 14px;
    }

    .stat .num {
      font-size: 22px;
      font-weight: 800;
      color: var(--red);
    }

    .stat .lbl {
      font-size: 12px;
      color: #666;
    }

    .debrief {
      font-size: 13.5px;
      line-height: 1.65;
      color: #333;
    }

    .debrief b {
      color: var(--red);
    }

    .debrief ol {
      padding-left: 18px;
      margin: 10px 0;
    }

    .debrief li {
      margin-bottom: 8px;
    }

    .facilitator-badge {
      position: fixed;
      top: 14px;
      right: 14px;
      background: var(--red);
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 20px;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .fac-map {
      max-width: 900px;
    }

    .fac-map h1 {
      font-size: 30px;
    }

    .small-link {
      font-size: 12px;
      color: #999;
      margin-top: 18px;
      text-align: center;
    }

    /* Debrief: três cartões, um por tela, cada um com o valor que esta pessoa
       produziu ali. A ordem importa de verdade — foi a sequência vivida. */
    .steps {
      margin: 18px 0 4px;
      display: grid;
      gap: 10px;
    }

    .steps-head {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #999;
    }

    .step3 {
      background: var(--light);
      border-left: 3px solid var(--red);
      border-radius: 0 10px 10px 0;
      padding: 13px 15px 14px;
    }

    .step3 header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
    }

    .step3 .ic {
      color: var(--red);
      display: inline-flex;
    }

    .step3 .vx {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--red);
    }

    .step3 .ord {
      margin-left: auto;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #aaa;
    }

    .step3 h4 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--dark);
    }

    /* A evidência é o dado da pessoa, então vai em mono, como leitura de máquina. */
    .step3 .ev {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      color: var(--dark);
      background: #fff;
      border-radius: 6px;
      padding: 8px 10px;
      overflow-wrap: anywhere;
    }

    .step3 .nb {
      font-size: 12px;
      line-height: 1.45;
      color: #888;
      margin-top: 7px;
    }

    .steps-cta {
      font-size: 13.5px;
      line-height: 1.6;
      color: #444;
      background: #fff0f1;
      border-radius: 10px;
      padding: 13px 15px;
      margin-top: 2px;
    }

    .steps-cta b { color: var(--red); }

    .card.dark .steps-head { color: #888; }
    .card.dark .step3 { background: #2f2b2c; }
    .card.dark .step3 h4 { color: #eee; }
    .card.dark .step3 .ev { background: #231f20; color: #eee; }
    .card.dark .step3 .nb { color: #999; }
    .card.dark .step3 .ord { color: #777; }
    .card.dark .steps-cta { background: #3a1416; color: #ddd; }
    .card.dark .steps-cta b { color: var(--pink); }

    @media (min-width: 620px) {
      .steps {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .steps-head,
      .steps-cta { grid-column: 1 / -1; }

      .step3 { display: flex; flex-direction: column; }
      .step3 .nb { margin-top: auto; padding-top: 7px; }
    }

    /* Retrato do grupo: um bloco por conjunto de campos gravados. */
    .breakdown { margin-top: 12px; }

    .bnote {
      font-size: 12px;
      line-height: 1.5;
      color: #777;
      margin: 0 0 16px 0;
    }

    .bgroup {
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-bottom: 18px;
    }

    .bgroup header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .bgroup h4 {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .bgroup header code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      color: #999;
      margin-left: auto;
    }

    .bchart { margin-bottom: 13px; }

    .blabel {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 6px;
    }

    .brow {
      display: grid;
      grid-template-columns: minmax(92px, 42%) 1fr 26px;
      gap: 9px;
      align-items: center;
      margin-bottom: 6px;
    }

    /* Rótulos quebram em duas linhas em vez de virar reticências: numa projeção
       ninguém pode passar o mouse para descobrir o que foi cortado. */
    .bk {
      font-size: 11.5px;
      line-height: 1.3;
      color: #555;
      overflow-wrap: anywhere;
    }

    .btrack {
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      height: 10px;
    }

    .bfill {
      background: var(--red);
      height: 100%;
      border-radius: 4px;
    }

    .bv {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      color: #555;
      text-align: right;
    }

    .card.dark .bnote { color: #999; }
    .card.dark .bgroup { border-top-color: #3a3536; }
    .card.dark .bgroup header code { color: #777; }
    .card.dark .blabel { color: #888; }
    .card.dark .bk,
    .card.dark .bv { color: #ccc; }
    .card.dark .btrack { background: #3a3536; }

    /* Duas colunas de blocos quando há largura, como na projeção. */
    @media (min-width: 720px) {
      .breakdown {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 26px;
        align-items: start;
      }

      .bnote { grid-column: 1 / -1; }
    }

    /* Legenda do mapa: cada marcador é desenhado, não nomeado por cor — a versão
       anterior dizia "vermelho" para um ponto que é escuro com anel vermelho. */
    .maplegend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      align-items: center;
      justify-content: center;
      margin: 0 0 14px 0;
    }

    .maplegend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #666;
    }

    .maplegend b {
      color: #333;
      font-weight: 700;
    }

    .card.dark .maplegend span { color: #aaa; }
    .card.dark .maplegend b { color: #eee; }

    .resources {
      border-top: 1px solid #eee;
      margin-top: 20px;
      padding-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
    }

    .card.dark .resources { border-top-color: #3a3536; }

    .reslink {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--light);
      border-radius: 10px;
      padding: 13px 14px;
    }

    .card.dark .reslink { background: #2f2b2c; }

    .reslink .k {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 5px;
    }

    .reslink .t {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
    }

    .reslink .d {
      font-size: 12px;
      line-height: 1.45;
      color: #777;
      margin-top: 4px;
    }

    .card.dark .reslink .d { color: #aaa; }

    .reslink:hover { outline: 2px solid var(--pink); }

    /* Variante escura: aplicada de verdade quando o SO do participante prefere modo escuro.
     Isso é a demonstração viva de SMCAS — o cartão muda de aparência sem ninguém pedir. */
    .card.dark {
      background: var(--dark);
      color: var(--white);
    }

    .card.dark h1 {
      color: var(--white);
    }

    .card.dark p.lead {
      color: #c9c9c9;
    }

    .card.dark .sysmsg {
      background: #2f2b2c;
      color: #eee;
      border-left-color: var(--pink);
    }

    .card.dark .slider-labels {
      color: #bbb;
    }

    .card.dark .choice {
      background: #2f2b2c;
      border-color: #2f2b2c;
      color: #eee;
    }

    .card.dark .choice:hover {
      border-color: var(--pink);
    }

    .card.dark .choice.selected {
      border-color: var(--red);
      background: #3a1416;
    }

    .card.dark .btn-secondary {
      background: #2f2b2c;
      color: white;
    }

    .card.dark .stat {
      background: #2f2b2c;
    }

    .card.dark .stat .lbl {
      color: #bbb;
    }

    .card.dark .debrief {
      color: #ddd;
    }

    .card.dark .hint {
      color: #999;
    }

    .card.dark .small-link {
      color: #888;
    }
  </style>
</head>

      // ---------- Firestore helpers (substituem window.storage) ----------
      // Estrutura: sessions/{sessionTag} { count }
      //            sessions/{sessionTag}/responses/{participantId} { sm, ud, vs, device, ts }
      function fb() { return window.__fb; }

      async function saveResponse(sessionTag, participantId, payload) {
        const { db, doc, setDoc } = fb();
        try {
          await setDoc(
            doc(db, 'sessions', sessionTag, 'responses', participantId),
            { ...payload, ts: Date.now() }
          );
          return true;
        } catch (e) { console.error('Firestore save failed', e); return false; }
      }

      // Incremento atômico via transação — resolve o problema de corrida que
      // existia na versão com window.storage (duas pessoas podiam pegar o
      // mesmo número se entrassem no mesmo instante).
      async function nextArrivalNumber(sessionTag) {
        const { db, doc, runTransaction } = fb();
        const ref = doc(db, 'sessions', sessionTag);
        try {
          const newCount = await runTransaction(db, async (tx) => {
            const snap = await tx.get(ref);
            const current = snap.exists() ? (snap.data().count || 0) : 0;
            const next = current + 1;
            tx.set(ref, { count: next }, { merge: true });
            return next;
          });
          return newCount;
        } catch (e) { console.error('Firestore transaction failed', e); return 1; }
      }

      function subscribeResponses(sessionTag, onChange) {
        const { db, collection, onSnapshot } = fb();
        return onSnapshot(collection(db, 'sessions', sessionTag, 'responses'), (snap) => {
          const dots = [];
          snap.forEach(d => dots.push(d.data()));
          onChange(dots);
        }, (err) => { console.error('Firestore listener error', err); });
      }

      async function resetSession(sessionTag) {
        const { db, doc, collection, getDocs, deleteDoc, setDoc } = fb();
        try {
          const snap = await getDocs(collection(db, 'sessions', sessionTag, 'responses'));
          const deletions = [];
          snap.forEach(d => deletions.push(deleteDoc(d.ref)));
          await Promise.all(deletions);
          await setDoc(doc(db, 'sessions', sessionTag), { count: 0 }, { merge: true });
        } catch (e) { console.error('Firestore reset failed', e); }
      }

  // ---------- state ----------
  const params = new URLSearchParams(location.search);
  const isFacilitator = params.get('facilitador') === '1' || params.get('facilitator') === '1';
  let sessionTag = (params.get('sessao') || 'geral').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40) || 'geral';
  const participantId = 'p' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

  const answers = { device:null, sm:5, ud:5, vs:null };

  // Sinais que realmente variam entre participantes, mesmo em sessão síncrona
  // no mesmo fuso horário — diferente de hora do dia, que seria igual para todos.
  const isMobile = window.innerWidth < 640;
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  answers.device = isMobile ? 'mobile' : 'desktop';

  function detectOS(){
    const ua = navigator.userAgent || '';
    if(/Windows/i.test(ua)) return 'Windows';
    if(/Android/i.test(ua)) return 'Android';
    if(/iPhone|iPad|iPod/i.test(ua)) return 'iOS';
    if(/Macintosh|Mac OS X/i.test(ua)) return 'macOS';
    if(/Linux/i.test(ua)) return 'Linux';
    return 'Outro';
  }
  const osName = detectOS();
  const locale = navigator.language || 'desconhecido';
  const sysTz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'desconhecido';

  // Sinais adicionais de ambiente — mesma categoria ética dos anteriores
  // (adaptação, não identificação): idiomas, qualidade de conexão,
  // classe de hardware, preferências de acessibilidade.
  const languages = (navigator.languages && navigator.languages.length)
    ? navigator.languages.join(', ') : locale;
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;
  const connInfo = conn ? {
    effectiveType: conn.effectiveType || 'desconhecido',
    saveData: !!conn.saveData
  } : null;
  const cpuCores = navigator.hardwareConcurrency || null;
  const ramApprox = navigator.deviceMemory || null; // GB, aproximado de propósito
  const a11y = {
    reducedMotion: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches,
    highContrast: window.matchMedia && window.matchMedia('(prefers-contrast: more)').matches,

  };

  // Geolocalização aproximada por IP — não é GPS, é uma estimativa (às vezes
  // erra por dezenas de km, e mostra o servidor em vez da pessoa se houver VPN).
  // Serviço externo (geojs.io); se a rede bloquear, degradamos silenciosamente.
  let geo = { city:null, region:null, country:null, lat:null, lon:null };
  async function fetchGeo(){
    try{
      // Sem AbortController aqui de propósito: options com AbortSignal não
      // atravessam o proxy de rede deste sandbox (DataCloneError). Timeout
      // via Promise.race em vez de sinal de cancelamento.
      const fetchPromise = fetch('https://get.geojs.io/v1/ip/geo.json').then(r=>r.json());
      const timeoutPromise = new Promise((_,reject)=> setTimeout(()=>reject(new Error('geo timeout')), 4000));
      const data = await Promise.race([fetchPromise, timeoutPromise]);
      geo = {
        city: data.city || null,
        region: data.region || null,
        country: data.country || null,
        lat: data.latitude ? parseFloat(data.latitude) : null,
        lon: data.longitude ? parseFloat(data.longitude) : null
      };
    }catch(e){
      console.warn('Geolocaliza\u00e7\u00e3o por IP indispon\u00edvel', e);
    }
    return geo;
  }

  const cardCls = 'card' + (prefersDark ? ' dark' : '');

  const app = document.getElementById('app');

  // ---------- scoring: barycentric normalization ----------
  function computeBary(a){
    const smRaw = a.sm;                 // 0-10
    const udRaw = a.ud;                 // 0-10
    const vsRaw = a.vs === 'privacidade' ? 9 : 2; // forced choice -> weight
    const sum = smRaw + udRaw + vsRaw;
    const sm = sum>0 ? smRaw/sum : 1/3;
    const ud = sum>0 ? udRaw/sum : 1/3;
    const vs = sum>0 ? vsRaw/sum : 1/3;
    return {sm,ud,vs};
  }

  async function submitAndShowMap(){
    const bary = computeBary(answers);
    const payload = {
      sm: bary.sm, ud: bary.ud, vs: bary.vs,
      device: answers.device,
      os: osName, locale: locale, tz: sysTz, languages: languages,
      city: geo.city, region: geo.region, country: geo.country,
      lat: geo.lat, lon: geo.lon,
      connType: connInfo ? connInfo.effectiveType : null,
      saveData: connInfo ? connInfo.saveData : null,
      cpuCores: cpuCores, ramApprox: ramApprox,
      reducedMotion: a11y.reducedMotion, highContrast: a11y.highContrast,
      smMoves: answers._sm_moves || 0, smSeconds: answers._sm_seconds || null
    };
    const saved = await saveResponse(sessionTag, participantId, payload);
    renderMap(bary, saved);
  }

  // ==================================================================
  // DEMONSTRAÇÃO DE FINGERPRINT — ISOLADA E LOCAL
  // Tudo aqui roda e fica só no navegador de quem clicou. Nada é
  // enviado ao storage, nada vira `participantId`, nada é comparado
  // com outros participantes. É uma demonstração de capacidade, não
  // uma coleta de dado. Ver conversa: implementar fingerprint real
  // ligado à sessão foi uma linha que decidimos não cruzar.
  // ==================================================================
  function simpleHash(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
    return (h>>>0).toString(16);
  }
  function getCanvasFingerprint(){
    try{
      const canvas = document.createElement('canvas');
      canvas.width = 220; canvas.height = 40;
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillStyle = '#f60';
      ctx.fillRect(0,0,100,20);
      ctx.fillStyle = '#069';
      ctx.fillText('fingerprint demo', 2, 2);
      ctx.fillStyle = 'rgba(102,204,0,0.7)';
      ctx.fillText('fingerprint demo', 4, 4);
      return simpleHash(canvas.toDataURL());
    }catch(e){ return null; }
  }
  function getWebGLInfo(){
    try{
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if(!gl) return null;
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if(!dbg) return { vendor:'protegido pelo navegador', renderer:'protegido pelo navegador' };
      return {
        vendor: gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || 'desconhecido',
        renderer: gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || 'desconhecido'
      };
    }catch(e){ return null; }
  }
  function getAudioInfo(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      const ctx = new AC();
      const info = {
        sampleRate: ctx.sampleRate,
        maxChannels: ctx.destination.maxChannelCount,
        baseLatency: ctx.baseLatency ? ctx.baseLatency.toFixed(5) : 'n/d'
      };
      ctx.close();
      return info;
    }catch(e){ return null; }
  }

    app.innerHTML = `

          <b>Identificador combinado:</b> <code>${combined}</code>

        Alguns navegadores (Firefox modo estrito, Safari, Brave) j\u00e1 reduzem ou

        <div class="debrief">
          <b>A decis\u00e3o que importa aqui n\u00e3o \u00e9 t\u00e9cnica, \u00e9 \u00e9tica:</b> t\u00ednhamos a capacidade

  // ---------- triangle math (posições ancoradas na imagem das 3 categorias) ----------
  // Coordenadas em espaço de imagem 1024x1024 (mesmo tamanho do PNG embutido):
  // SM perto do ícone de engrenagem/loop, UD perto do ícone de pessoa, VS perto do escudo.
  const V = {
    SM: {x:245, y:270},   // ícone de auto-gestão (topo-esquerda)
    UD: {x:755, y:290},   // ícone de pessoa/usuário (topo-direita)
    VS: {x:510, y:780}    // ícone de escudo/sociedade (baixo-centro)
  };
  function toXY(bary){
    return {
      x: bary.sm*V.SM.x + bary.ud*V.UD.x + bary.vs*V.VS.x,
      y: bary.sm*V.SM.y + bary.ud*V.UD.y + bary.vs*V.VS.y
    };
  }

  // A legenda desenha os marcadores de verdade, em vez de nomear cores. Antes
  // dizia "seu ponto: vermelho" para um ponto de miolo escuro com anel vermelho.

    const sw = (inner) => `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">${inner}</svg>`;
    const mine = sw(`<circle cx="11" cy="11" r="10" fill="#FFFFFF" stroke="#231F20" stroke-opacity="0.14"/>
      <circle cx="11" cy="11" r="7" fill="#231F20" stroke="#E8172D" stroke-width="3"/>`);
    const other = sw(`<circle cx="11" cy="11" r="9" fill="#FFFFFF" stroke="#231F20" stroke-opacity="0.14"/>
      <circle cx="11" cy="11" r="6" fill="#E8172D" stroke="#231F20" stroke-width="1.5"/>`);
    const avg = sw(`<circle cx="11" cy="11" r="8" fill="none" stroke="#0097A7" stroke-width="3" stroke-dasharray="4,3"/>`);
    return `
      <div class="maplegend">
        ${hasMine ? `<span>${mine}<b>voc\u00ea</b></span>` : ''}
        <span>${other}${hasMine ? 'demais participantes' : 'participantes'}</span>
        <span>${avg}m\u00e9dia do grupo</span>
      </div>`;
  }

          <div class="k">Leitura guiada</div>
          <div class="t">Tr\u00eas categorias de sistemas sens\u00edveis ao contexto</div>
          <div class="d">SMCAS, UDCAS, VSCAS, SDBC e AORTA \u2014 com \u00e1udio, mapa mental e apresenta\u00e7\u00e3o.</div>
        </a>
        <a class="reslink" href="blog.html" target="_blank" rel="noopener">
          <div class="k">Blog</div>
          <div class="t">Al\u00e9m do algoritmo</div>
          <div class="d">O ensaio em formato de leitura corrida: como o contexto est\u00e1 redefinindo a intelig\u00eancia das m\u00e1quinas.</div>
        </a>
        <a class="reslink" href="resources/ThreeCategoriesofCAS.pdf" target="_blank" rel="noopener">
          <div class="k">Artigo original \u00b7 PDF</div>
          <div class="t">Three Categories of Context-Aware Systems</div>
          <div class="d">Shishkov, Larsen, Warnier &amp; Janssen (BMSD 2018) \u2014 manuscrito aceito.</div>
        </a>
      </div>`;
  }

  function svgTriangle(dots, myXY){
    // Pontos com halo branco por baixo para se destacarem sobre a imagem,
    // mesmo esmaecida.
    let dotSvg = dots.map(d=>{
      const p = toXY(d);
      return `
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="20" fill="#FFFFFF" fill-opacity="0.95" stroke="#231F20" stroke-opacity="0.14" stroke-width="1.5"/>
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="14" fill="#E8172D" stroke="#231F20" stroke-width="2.5"/>`;
    }).join('');
    let mySvg = '';
    if(myXY){
      mySvg = `
        <circle cx="${myXY.x.toFixed(1)}" cy="${myXY.y.toFixed(1)}" r="34" fill="#FFFFFF" fill-opacity="0.98" stroke="#231F20" stroke-opacity="0.14" stroke-width="1.5"/>
        <circle cx="${myXY.x.toFixed(1)}" cy="${myXY.y.toFixed(1)}" r="25" fill="#231F20" stroke="#E8172D" stroke-width="5"/>`;
    }
    let centroidSvg = '';
    if(dots.length>0){
      const avg = dots.reduce((acc,d)=>({sm:acc.sm+d.sm,ud:acc.ud+d.ud,vs:acc.vs+d.vs}),{sm:0,ud:0,vs:0});
      const n = dots.length;
      const avgBary = {sm:avg.sm/n, ud:avg.ud/n, vs:avg.vs/n};
      const c = toXY(avgBary);
      centroidSvg = `
        <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="9"/>
        <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="30" fill="none" stroke="#0097A7" stroke-width="5" stroke-dasharray="9,7"/>`;
    }
    // A placa clara existe para o diagrama sobreviver ao cartão escuro. A grade
    // repete o fundo da tela de abertura, na escala do viewBox de 1024.
    return `
      <svg viewBox="0 0 1024 1112" width="100%" style="max-width:560px;display:block;margin:0 auto;">
        <defs>
          <pattern id="mapgrid" width="64" height="64" patternUnits="userSpaceOnUse">
            <path d="M64 0H0V64" fill="none" stroke="#231F20" stroke-opacity="0.07" stroke-width="1.5"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="1024" height="1112" rx="26" fill="#FFFFFF"/>
        <rect x="0" y="0" width="1024" height="1112" rx="26" fill="url(#mapgrid)"/>
        <image href="${THREE_CATEGORIES_IMG}" x="0" y="0" width="1024" height="1024" opacity="0.65"/>
        ${dotSvg}
        ${centroidSvg}
        ${mySvg}
        <!-- Faixa de legenda: a imagem já rotula as três regiões em inglês, então
             os acrônimos do artigo ficam fora do desenho, sem sobrepor nada. -->
        <path d="M0 1024h1024v62a26 26 0 0 1-26 26H26a26 26 0 0 1-26-26z" fill="#F2F2F2"/>
        <path d="M0 1024h1024" stroke="#231F20" stroke-opacity="0.12" stroke-width="1.5"/>
        <g font-size="32" font-weight="800" fill="#E8172D" text-anchor="middle" letter-spacing="1.5">
          <text x="${V.SM.x}" y="1080">SMCAS</text>
          <text x="${V.UD.x}" y="1080">UDCAS</text>
          <text x="${V.VS.x}" y="1080">VSCAS</text>
        </g>
        <rect x="0.75" y="0.75" width="1022.5" height="1110.5" rx="26" fill="none" stroke="#231F20" stroke-opacity="0.12" stroke-width="1.5"/>
      </svg>
    `;
  }

  // ---------- Mapa de proximidade (geolocalização aproximada por IP) ----------
  // Não é um mapa cartográfico real (sem contornos de continente) — é uma
  // grade lat/long simples e honesta sobre sua própria imprecisão.
  function geoToXY(lat, lon){
    // Equiretangular simples. viewBox 0 0 360 200. lon -180..180 -> x 0..360. lat 90..-90 -> y 0..200.
    const x = (lon + 180) * (360/360);
    const y = (90 - lat) * (200/180);
    return {x, y};
  }

  function svgClusterMap(dots){
    const withGeo = dots.filter(d => typeof d.lat === 'number' && typeof d.lon === 'number');
    if(withGeo.length === 0){
      return '<p class="hint" style="text-align:center;padding:20px 0;">Ainda sem localizações suficientes para plotar.</p>';
    }
    // Agrupa por cidade para mostrar contagem em vez de pontos 100% sobrepostos.
    const groups = {};
    withGeo.forEach(d=>{
      const key = `${d.city || '?'}|${d.country || '?'}`;
      if(!groups[key]) groups[key] = { city:d.city, country:d.country, lat:d.lat, lon:d.lon, count:0 };
      groups[key].count += 1;
    });
    const pts = Object.values(groups);
    const maxCount = Math.max(...pts.map(p=>p.count));
    const graticule = [];
    for(let gx=0; gx<=360; gx+=30){ graticule.push(`<line x1="${gx}" y1="0" x2="${gx}" y2="200" stroke="#e6e6e6" stroke-width="0.5"/>`); }
    for(let gy=0; gy<=200; gy+=20){ graticule.push(`<line x1="0" y1="${gy}" x2="360" y2="${gy}" stroke="#e6e6e6" stroke-width="0.5"/>`); }
    // Cidades vizinhas viram pontos quase sobrepostos e os rótulos se atropelam.
    // Cada rótulo procura a primeira faixa livre, alternando acima e abaixo do
    // ponto e afastando-se aos poucos até não colidir com nenhum já colocado.
    const placed = [];
    function labelY(x, y, r){
      const cands = [];
      for(let k=0; k<7; k++){
        cands.push(y - r - 4 - k*9);
        cands.push(y + r + 8 + k*9);
      }
      for(const ly of cands){
        if(ly < 8 || ly > 194) continue;
        if(!placed.some(q => Math.abs(q.x - x) < 38 && Math.abs(q.y - ly) < 8.5)) return ly;
      }
      return y - r - 4;
    }
    const dotsSvg = pts.slice().sort((a,b)=>b.count-a.count).map(p=>{
      const xy = geoToXY(p.lat, p.lon);
      const r = 4 + (p.count / maxCount) * 10;
      const name = p.city || 'Local desconhecido';
      const label = `${name}${p.country ? ', ' + p.country : ''} (${p.count})`;
      const ly = labelY(xy.x, xy.y, r);
      placed.push({ x: xy.x, y: ly });
      // Linha-guia quando o rótulo precisou se afastar do próprio ponto.
      const gap = Math.abs(ly - xy.y) - r;
      const leader = gap > 12
        ? `<line x1="${xy.x.toFixed(1)}" y1="${(xy.y + (ly > xy.y ? r : -r)).toFixed(1)}"
                 x2="${xy.x.toFixed(1)}" y2="${(ly + (ly > xy.y ? -5 : 2)).toFixed(1)}"
                 stroke="#231F20" stroke-opacity="0.25" stroke-width="0.6"/>`
        : '';
      return `<g>
        <circle cx="${xy.x.toFixed(1)}" cy="${xy.y.toFixed(1)}" r="${r.toFixed(1)}" fill="#E8172D" fill-opacity="0.55" stroke="white" stroke-width="1"/>
        ${leader}
        <text x="${xy.x.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="7" font-weight="600"
              fill="#231F20" stroke="#FAFAFA" stroke-width="2.4" paint-order="stroke">${label}</text>
      </g>`;
    }).join('');
    return `
      <svg viewBox="0 0 360 200" width="100%" style="max-width:820px;display:block;margin:0 auto;background:#fafafa;border-radius:10px;">
        ${graticule.join('')}
        <line x1="180" y1="0" x2="180" y2="200" stroke="#ccc" stroke-width="1"/>
        <line x1="0" y1="100" x2="360" y2="100" stroke="#ccc" stroke-width="1"/>
        ${dotsSvg}
      </svg>
      <p class="hint" style="text-align:center;">Posições aproximadas por IP (n\u00e3o \u00e9 GPS) \u2014 ilustrativo, n\u00e3o cartogr\u00e1fico.</p>
    `;
  }

  // Retrato do grupo a partir de tudo que foi de fato gravado em cada resposta.
  // Cada bloco corresponde a um conjunto de campos do payload — nada aqui é
  // inferido além do agrupamento em faixas dos valores numéricos.
  function breakdownHtml(dots){
    if(!dots.length) return '';

    const tally = (fn) => {
      const c = {};
      dots.forEach(d=>{ const k = fn(d); if(k!=null) c[k] = (c[k]||0)+1; });
      return c;
    };
    const band = (v, cuts, labels, suffix) => {
      if(v==null) return null;
      for(let i=0;i<cuts.length;i++){ if(v<=cuts[i]) return labels[i]; }
      return labels[labels.length-1] + (suffix||'');
    };

    const GROUPS = [
      { title:'Aparelho', fields:'os · device · cpuCores · ramApprox', charts:[
        ['Sistema operacional', tally(d=>d.os || 'N\u00e3o informado')],
        ['Tipo de dispositivo', tally(d=>d.device==='mobile'?'M\u00f3vel':d.device==='manual'?'Entrada manual':'Desktop')],
        ['N\u00facleos de CPU', tally(d=>band(d.cpuCores,[2,4,8],['at\u00e9 2','3 a 4','5 a 8','9 ou mais']) || 'N\u00e3o informado')],
        ['Mem\u00f3ria aproximada', tally(d=>band(d.ramApprox,[2,4,8],['at\u00e9 2 GB','3 a 4 GB','5 a 8 GB','mais de 8 GB']) || 'N\u00e3o informada')]
      ]},
      { title:'Lugar e idioma', fields:'city · region · country · tz · languages', charts:[
        ['Cidade (por IP)', tally(d=>d.city || 'N\u00e3o resolvida')],
        ['Pa\u00eds (por IP)', tally(d=>d.country || 'N\u00e3o resolvido')],
        ['Fuso do sistema', tally(d=>d.tz || 'N\u00e3o informado')],
        ['Idioma principal', tally(d=>(d.languages||'').split(',')[0].trim() || 'N\u00e3o informado')]
      ]},
      { title:'Rede', fields:'connType · saveData', charts:[
        ['Tipo de conex\u00e3o', tally(d=>d.connType || 'N\u00e3o informado')],
        ['Economia de dados', tally(d=>d.saveData==null?'N\u00e3o informada':(d.saveData?'Ativada':'Desativada'))]
      ]},
      { title:'Acessibilidade declarada ao sistema', fields:'reducedMotion · highContrast', charts:[
        ['Menos anima\u00e7\u00e3o', tally(d=>d.reducedMotion==null?'N\u00e3o informada':(d.reducedMotion?'Pediu':'N\u00e3o pediu'))],
        ['Mais contraste', tally(d=>d.highContrast==null?'N\u00e3o informada':(d.highContrast?'Pediu':'N\u00e3o pediu'))]
      ]},
      { title:'Comportamento observado, sem pergunta', fields:'smMoves · smSeconds', charts:[
        ['Ajustes no 1\u00ba slider', tally(d=>band(d.smMoves,[0,2,5,10],['nenhum','1 a 2','3 a 5','6 a 10','mais de 10']) || 'N\u00e3o registrado')],
        ['Tempo para decidir', tally(d=>band(d.smSeconds,[3,8,20],['at\u00e9 3 s','4 a 8 s','9 a 20 s','mais de 20 s']) || 'N\u00e3o registrado')]
      ]},
      { title:'Posi\u00e7\u00e3o declarada', fields:'sm · ud · vs', charts:[
        ['Escolha da 3\u00aa pergunta', tally(d=>d.vs==null?'N\u00e3o registrada':(d.vs>0.35?'Privacidade m\u00e1xima':'Personaliza\u00e7\u00e3o m\u00e1xima'))],
        ['V\u00e9rtice mais forte', tally(d=>{
          if(d.sm==null) return 'N\u00e3o registrado';
          const m = Math.max(d.sm,d.ud,d.vs);
          return m===d.sm?'SMCAS':m===d.ud?'UDCAS':'VSCAS';
        })]
      ]}
    ];

    function bars(counts){
      const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]));
      const max = Math.max(...entries.map(e=>e[1]), 1);
      return entries.map(([k,v])=>`
        <div class="brow">
          <div class="bk" title="${k}">${k}</div>
          <div class="btrack"><div class="bfill" style="width:${Math.max(3, v/max*100).toFixed(0)}%"></div></div>
          <div class="bv">${v}</div>
        </div>`).join('');
    }

    const blocks = GROUPS.map(g=>{
      const charts = g.charts.filter(c=>Object.keys(c[1]).length);
      if(!charts.length) return '';
      return `
        <section class="bgroup">
          <header>
            <h4>${g.title}</h4>
            <code>${g.fields}</code>
          </header>
          ${charts.map(([label,counts])=>`
            <div class="bchart">
              <div class="blabel">${label}</div>
              ${bars(counts)}
            </div>`).join('')}
        </section>`;
    }).join('');

    return `
      <div class="breakdown">
        <p class="bnote">${dots.length} ${dots.length===1?'resposta':'respostas'} \u00b7
        cada bloco abaixo \u00e9 um conjunto de campos realmente gravado. Ningu\u00e9m digitou nada
        disso: as tr\u00eas perguntas produziram apenas o \u00faltimo bloco.</p>
        ${blocks}
      </div>
    `;
  }

  let unsubscribe = null;

  // O debrief deixa de ser texto genérico: cada passo mostra o valor que esta
  // pessoa realmente produziu naquela tela. Quem está ao lado viu outra coisa.
  function debriefSteps(){
    const ico = (d) => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

    const q2label = {
      hesitou: 'a vers\u00e3o de quem hesitou',
      auto: 'a vers\u00e3o de quem confia no autom\u00e1tico',
      manual: 'a vers\u00e3o de quem quer controlar tudo',
      meio: 'a vers\u00e3o de quem ficou no meio-termo'
    }[answers._q2branch] || 'uma das quatro vers\u00f5es';

    const moves = answers._sm_moves || 0;
    const secs = answers._sm_seconds;

    const STEPS = [
      {
        vx: 'SMCAS',
        icon: ico('<path d="M20 12a8 8 0 1 0-2.3 5.6"/><path d="M20 6v5h-5"/><circle cx="12" cy="12" r="2.6"/>'),
        title: 'Reagiu ao pr\u00f3prio estado, antes de perguntar',
        ev: [
          (answers._arrival ? answers._arrival + '\u00aa a entrar' : null),
          (isMobile ? 'celular' : 'computador'),
          osName,
          (isTouch ? 'toque' : 'mouse'),
          'tema ' + (prefersDark ? 'escuro' : 'claro')
        ].filter(Boolean).join(' \u00b7 '),
        nb: 'Nada disso passou por um formul\u00e1rio.'
      },
      {
        vx: 'UDCAS',
        icon: ico('<circle cx="12" cy="8" r="3.2"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>'),
        title: 'Reescreveu a 2\u00aa pergunta para voc\u00ea',
        ev: `${moves} ${moves === 1 ? 'ajuste' : 'ajustes'} no 1\u00ba slider${secs ? ', ' + secs + ' s para decidir' : ''} \u2192 ${q2label}`,
        nb: 'Quem est\u00e1 do seu lado leu outro enunciado.'
      },
      {
        vx: 'VSCAS',
        icon: ico('<path d="M12 3 5.5 5.6v5.6c0 4 2.7 7.1 6.5 8.2 3.8-1.1 6.5-4.2 6.5-8.2V5.6L12 3Z"/>'),
        title: 'For\u00e7ou voc\u00ea a declarar um valor',
        ev: answers.vs === 'privacidade' ? 'voc\u00ea escolheu Privacidade m\u00e1xima'
          : answers.vs === 'personalizacao' ? 'voc\u00ea escolheu Personaliza\u00e7\u00e3o m\u00e1xima'
          : 'escolha n\u00e3o registrada',
        nb: 'Sem meio-termo, de prop\u00f3sito.'
      }
    ];

    return `
      <div class="steps">
        <div class="steps-head">O que acabou de acontecer</div>
        ${STEPS.map((st, i) => `
          <article class="step3">
            <header>
              <span class="ic">${st.icon}</span>
              <span class="vx">${st.vx}</span>
              <span class="ord">tela ${i + 1}</span>
            </header>
            <h4>${st.title}</h4>
            <div class="ev">${st.ev}</div>
            <div class="nb">${st.nb}</div>
          </article>`).join('')}
        <div class="steps-cta">
          <b>Agora olhem o mapa juntos.</b> O grupo est\u00e1 puxando para algum v\u00e9rtice?
          Isso diz algo sobre como esta organiza\u00e7\u00e3o tende a projetar sistemas?
        </div>
      </div>`;
  }

  function renderMap(myBary, saved){
    const myXY = myBary ? toXY(myBary) : null;
    const warningHtml = (saved === false) ? `
      <div class="sysmsg" style="border-left-color:#e0a800;background:#fff8e6;">
        <b>Aviso:</b> n\u00e3o conseguimos confirmar que sua resposta foi salva
        (erro de armazenamento). Seu ponto pode n\u00e3o aparecer no mapa do grupo.
        Avise o facilitador \u2014 ele pode adicionar sua resposta manualmente.
      </div>` : '';
    app.innerHTML = `
      <div class="${cardCls} mapcard">
        <div class="eyebrow">Mapa coletivo \u2014 sess\u00e3o "${sessionTag}"</div>
        <h1>Onde o grupo est\u00e1 caindo, agora?</h1>
        ${warningHtml}
        <div class="stat">
          <div><div class="lbl">participantes at\u00e9 agora</div><div class="num" id="countnum">\u2026</div></div>
        </div>
        ${mapLegend(true)}
        <div id="svgwrap"><div style="padding:40px 0;color:#888;">carregando\u2026</div></div>
        ${debriefSteps()}

        <div style="border-top:1px solid #eee;margin-top:20px;padding-top:18px;">
          <div class="eyebrow">Sem voc\u00ea revelar nada</div>
          <h1 style="font-size:17px;">O que o sistema j\u00e1 sabia sobre o grupo</h1>
          <div id="clusterwrap"><div style="padding:20px 0;color:#888;">carregando\u2026</div></div>
          <div id="breakdownwrap"></div>
        </div>

        <div style="border-top:1px solid #eee;margin-top:20px;padding-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn-secondary" id="dossieBtn" style="width:auto;padding:10px 16px;">Revelar meu doss\u00ea individual</button>
          <button class="btn-secondary" id="fpBtn" style="width:auto;padding:10px 16px;">At\u00e9 onde isso poderia ir?</button>
        </div>
        ${resourcesBlock()}
      </div>
    `;
    document.getElementById('dossieBtn').onclick = function(){ renderDossie(function(){ renderMap(myBary, saved); }); };
    document.getElementById('fpBtn').onclick = function(){ renderFingerprintDemo(function(){ renderMap(myBary, saved); }); };
    if(unsubscribe) unsubscribe();
    unsubscribe = subscribeResponses(sessionTag, (dots)=>{
      document.getElementById('countnum').textContent = dots.length;
      document.getElementById('svgwrap').innerHTML = svgTriangle(dots, myXY);
      document.getElementById('clusterwrap').innerHTML = svgClusterMap(dots);
      document.getElementById('breakdownwrap').innerHTML = breakdownHtml(dots);
    });
  }

  // ---------- Dossiê individual: coletado vs. deliberadamente não coletado ----------
  function renderDossie(previousScreen){
    const localTxt = geo.city
      ? `${geo.city}${geo.region ? ', ' + geo.region : ''}${geo.country ? ' (' + geo.country + ')' : ''}`
      : 'indispon\u00edvel';
    const a11yList = [];
    if(a11y.reducedMotion) a11yList.push('menos anima\u00e7\u00e3o');
    if(a11y.highContrast) a11yList.push('mais contraste');
    if(a11y.forcedColors) a11yList.push('cores for\u00e7adas');
    app.innerHTML = `
      <div class="${cardCls}">
        <div class="eyebrow">Seu doss\u00ea nesta sess\u00e3o</div>
        <h1>Isto \u00e9 s\u00f3 o que uma organiza\u00e7\u00e3o com escr\u00fapulos captura</h1>
        <div class="sysmsg">
          <b>Coletado:</b><br>
          IP aproximado \u2192 ${localTxt}<br>
          Dispositivo \u2192 ${isMobile ? 'M\u00f3vel' : 'Desktop'}, ${osName}${cpuCores ? `, ${cpuCores} n\u00facleos` : ''}${ramApprox ? `, ~${ramApprox}GB RAM` : ''}<br>
          Navegador \u2192 idiomas: ${languages}<br>
          Tema \u2192 ${prefersDark ? 'escuro' : 'claro'}; entrada \u2192 ${isTouch ? 'toque' : 'mouse/trackpad'}<br>
          Fuso \u2192 ${sysTz}${connInfo ? `; conex\u00e3o \u2192 ${connInfo.effectiveType}` : ''}<br>
          Acessibilidade \u2192 ${a11yList.length ? a11yList.join(', ') : 'nenhuma prefer\u00eancia especial detectada'}<br>
          Comportamento \u2192 ${answers._sm_moves || 0} ajustes na 1\u00aa pergunta, ${answers._sm_seconds || '?'}s para decidir
        </div>
        <div class="sysmsg" style="border-left-color:#999;background:#f5f5f5;">
          <b style="color:#666;">Deliberadamente n\u00e3o coletado, embora fosse t\u00e9cnicamente poss\u00edvel:</b><br>
          <span style="text-decoration:line-through;color:#999;">Fingerprint de Canvas</span><br>
          <span style="text-decoration:line-through;color:#999;">Vendor/renderer da GPU (WebGL debug info)</span><br>
          <span style="text-decoration:line-through;color:#999;">Fingerprint de \u00e1udio</span><br>
          <span style="text-decoration:line-through;color:#999;">Identificador \u00fanico combinando estes sinais, persistente entre sess\u00f5es</span>
        </div>
        <div class="debrief">
          Nada acima foi digitado por voc\u00ea. E a segunda lista mostra o quanto d\u00e1 pra
          ir al\u00e9m disso \u2014 e escolhemos n\u00e3o ir. Essa escolha, n\u00e3o a t\u00e9cnica, \u00e9 o que
          separa um sistema <b>sens\u00edvel a valores</b> de um sistema que s\u00f3 \u00e9 capaz.
        </div>
        <button class="btn-secondary" id="backBtn2" style="margin-top:16px;">Voltar</button>
      </div>
    `;
    document.getElementById('backBtn2').onclick = previousScreen;
  }

  // ---------- Facilitator screen (projection, no questions) ----------
  function renderFacilitator(){
    document.body.insertAdjacentHTML('afterbegin', '<div class="facilitator-badge">Modo facilitador</div>');
    app.innerHTML = `
      <div class="${cardCls} fac-map">
        <div class="eyebrow">Sess\u00e3o "${sessionTag}" \u2014 vis\u00e3o de proje\u00e7\u00e3o</div>
        <h1>Mapa coletivo ao vivo</h1>
        <div class="stat">
          <div><div class="lbl">participantes</div><div class="num" id="countnum">\u2026</div></div>
          <button class="btn-secondary" id="resetBtn" style="width:auto;padding:10px 18px;">Reiniciar rodada</button>
        </div>
        ${mapLegend(false)}
        <div id="svgwrap"><div style="padding:40px 0;color:#888;">carregando\u2026</div></div>
        <p class="hint">Compartilhe o link sem "?facilitador=1" com os participantes.
        Todos que entrarem com <b>?sessao=${sessionTag}</b> aparecem aqui.</p>

        <div style="border-top:1px solid #eee;margin-top:18px;padding-top:16px;">
          <div class="eyebrow">Reforço para o debrief final</div>
          <h1 style="font-size:19px;">Onde est\u00e1 o grupo, e em que rodam</h1>
          <div id="clusterwrap"><div style="padding:20px 0;color:#888;">carregando\u2026</div></div>
          <div id="breakdownwrap"></div>
        </div>

        <div style="border-top:1px solid #eee;margin-top:18px;padding-top:16px;">
          <button class="btn-secondary" id="manualToggle" style="background:transparent;border:1.5px dashed #ccc;">
            + Adicionar resposta manual (para quem n\u00e3o conseguiu conectar)
          </button>
          <div id="manualPanel" style="display:none;margin-top:14px;">
            <div class="slider-wrap">
              <div class="slider-labels"><span>Controlar tudo</span><span>Piloto autom\u00e1tico</span></div>
              <input type="range" min="0" max="10" value="5" id="manualSm">
            </div>
            <div class="slider-wrap">
              <div class="slider-labels"><span>Sempre igual</span><span>Se adapta a mim</span></div>
              <input type="range" min="0" max="10" value="5" id="manualUd">
            </div>
            <div class="choice-grid" style="margin-top:14px;">
              <div class="choice" data-v="personalizacao" id="manualChoiceA"><b>Personaliza\u00e7\u00e3o m\u00e1xima</b></div>
              <div class="choice" data-v="privacidade" id="manualChoiceB"><b>Privacidade m\u00e1xima</b></div>
            </div>
            <button class="btn-primary" id="manualAdd" style="margin-top:12px;" disabled>Adicionar ao mapa</button>
          </div>
        </div>
        ${resourcesBlock()}
      </div>
    `;
    document.getElementById('resetBtn').onclick = async function(){
      if(!confirm('Isso apaga todas as respostas desta sess\u00e3o. Confirmar?')) return;
      await resetSession(sessionTag);
    };

    // Entrada manual — cobre quem não conseguiu conectar pela rede institucional.
    document.getElementById('manualToggle').onclick = function(){
      const panel = document.getElementById('manualPanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    };
    let manualVs = null;
    document.getElementById('manualChoiceA').onclick = function(){
      manualVs = 'personalizacao';
      document.getElementById('manualChoiceA').classList.add('selected');
      document.getElementById('manualChoiceB').classList.remove('selected');
      document.getElementById('manualAdd').disabled = false;
    };
    document.getElementById('manualChoiceB').onclick = function(){
      manualVs = 'privacidade';
      document.getElementById('manualChoiceB').classList.add('selected');
      document.getElementById('manualChoiceA').classList.remove('selected');
      document.getElementById('manualAdd').disabled = false;
    };
    document.getElementById('manualAdd').onclick = async function(){
      const sm = parseInt(document.getElementById('manualSm').value,10);
      const ud = parseInt(document.getElementById('manualUd').value,10);
      const bary = computeBary({ sm, ud, vs: manualVs });
      const manualId = 'manual-' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
      const ok = await saveResponse(sessionTag, manualId, { sm:bary.sm, ud:bary.ud, vs:bary.vs, device:'manual' });
      if(!ok) alert('N\u00e3o consegui salvar essa resposta manual. Tente de novo em alguns segundos.');
      document.getElementById('manualPanel').style.display = 'none';
      document.getElementById('manualAdd').disabled = true;
      manualVs = null;
      document.querySelectorAll('#manualPanel .choice').forEach(c=>c.classList.remove('selected'));
    };
    if(unsubscribe) unsubscribe();
    unsubscribe = subscribeResponses(sessionTag, (dots)=>{
      document.getElementById('countnum').textContent = dots.length;
      document.getElementById('svgwrap').innerHTML = svgTriangle(dots, null);
      document.getElementById('clusterwrap').innerHTML = svgClusterMap(dots);
      document.getElementById('breakdownwrap').innerHTML = breakdownHtml(dots);
    });
  }


      // ---------- boot com fallback de rede ----------
      // Redes institucionais (universidade/empresa) por vezes bloqueiam domínios
      // do Google Cloud. Se o Firestore não responder em 6s, mostramos uma saída
      // clara em vez de deixar a pessoa presa em "carregando...".
      let resolved = false;
      function boot() {
        resolved = true;
        if (isFacilitator) {
          renderFacilitator();
        } else {
          renderLanding();
        }
      }
      function renderConnectionIssue() {
        app.innerHTML = `
      <div class="card">
        <div class="eyebrow">Conex\u00e3o lenta ou bloqueada</div>
        <h1>N\u00e3o consegui falar com o banco de dados.</h1>
        <p class="lead">Isso costuma acontecer quando a rede local (universidade, empresa)
        bloqueia dom\u00ednios do Google Cloud.</p>
        <div class="sysmsg">
          <b>1.</b> Se poss\u00edvel, troque para <b>dados m\u00f3veis do celular</b> ou um hotspot pessoal.<br><br>
          <b>2.</b> Clique em "Tentar novamente" abaixo.<br><br>
          <b>3.</b> Se continuar travado, avise o facilitador pelo chat/voz \u2014 ele pode
          adicionar sua resposta manualmente, sem voc\u00ea perder a din\u00e2mica.
        </div>
        <button class="btn-primary" onclick="location.reload()">Tentar novamente</button>
      </div>
    `;
      }
      if (window.__fb) {
        boot();
      } else {
        window.addEventListener('fb-ready', function () { if (!resolved) boot(); });
        setTimeout(function () { if (!resolved) renderConnectionIssue(); }, 6000);
      }
    })();
  </script>
</body>

</html>
